# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# The database is on Neon; paste its direct connection string as DATABASE_URL when prompted.
services:
  - type: web
    name: reeltime
    runtime: docker
    plan: free
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false # Neon direct connection string, ending in ?sslmode=require
      - key: TMDB_API_KEY
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
